[package]
name = "traindle-explorer"
version = "0.2.0"
edition = "2021"
description = "Traindle Explorer: solve and explore make-a-target-from-digits puzzles"

[dependencies]
astro-float = "0.9"
clap = { version = "4.5", features = ["derive"] }
hashbrown = "0.15"
libm = "0.2"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 2
